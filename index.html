<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vocale AI - CAA Predittiva</title>
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <!-- iOS App Capable -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vocale AI">
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 width=%22180%22 height=%22180%22 fill=%22none%22 stroke=%22%2306b6d4%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z%22/><path d=%22M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z%22/></svg>">
    
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts & Material Symbols (Stitch Design System) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Atkinson+Hyperlegible+Next:wght@600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
</head>
<body>

    <header class="app-header">
        <div class="header-left">
            <span class="material-symbols-outlined logo-icon">graphic_eq</span>
            <div class="logo-wrapper">
                <h1 class="logo">Vocale <span class="accent">AI</span></h1>
                <div id="status" class="status-subtext">Caricamento in corso...</div>
            </div>
        </div>
        
        <!-- Context status pill (Stitch style) -->
        <div id="heard-box" class="heard-box hidden">
            <span class="heard-label">Ascoltato:</span>
            <span id="heard-text" class="heard-text">...</span>
            <canvas id="audio-visualizer" width="80" height="20"></canvas>
        </div>
        
        <button id="settings-open-btn" class="icon-btn" aria-label="Apri impostazioni">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
    </header>

    <main class="container">
        <section class="interaction-area">
            <div class="grid-layout">
                <!-- Predictive Buttons (Populated by JS) -->
                <button id="suggest-1" class="suggestion-btn empty" disabled>
                    <span class="btn-num">1</span>
                    <span class="btn-text">Caricamento...</span>
                </button>
                <button id="suggest-2" class="suggestion-btn empty" disabled>
                    <span class="btn-num">2</span>
                    <span class="btn-text">Caricamento...</span>
                </button>
                <button id="suggest-3" class="suggestion-btn empty" disabled>
                    <span class="btn-num">3</span>
                    <span class="btn-text">Caricamento...</span>
                </button>
                
                <!-- Custom Option Button -->
                <button id="custom-btn" class="suggestion-btn custom-option">
                    <span class="material-symbols-outlined btn-icon text-primary">keyboard</span>
                    <span class="btn-text">Scrivi altro...</span>
                </button>
            </div>

            <!-- Central Microphone Button -->
            <div class="mic-container">
                <button id="mic-btn" aria-label="Attiva microfono" class="mic-pulse-btn">
                    <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
                <span id="mic-instruction" class="mic-instruction">Tocca per parlare</span>
            </div>
        </section>
    </main>

    <!-- Emergency Footer -->
    <footer class="emergency-bar" id="emergency-bar">
        <!-- Will be dynamically populated by JS -->
    </footer>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="settings-title">Impostazioni</h2>
                <button id="settings-close-btn" class="close-btn" aria-label="Chiudi impostazioni">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="api-key-input">Gemini API Key</label>
                    <input type="password" id="api-key-input" placeholder="Inserisci la tua API Key...">
                    <small>La chiave viene salvata localmente sul tuo dispositivo.</small>
                </div>

                <div class="form-group">
                    <label for="instructions-input">Profilo Utente / Istruzioni IA</label>
                    <textarea id="instructions-input" placeholder="Es. 'Sono un ragazzo di 20 anni, rispondi con uno stile molto informale e giovanile' oppure 'Usa un tono professionale e formale'..." rows="2"></textarea>
                    <small>Aiuta Gemini ad adattare le risposte alla tua personalità e alle tue esigenze.</small>
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label for="username-input">Nome Utente (Allerta)</label>
                        <input type="text" id="username-input" placeholder="Es. Marco">
                    </div>
                    <div class="form-group half">
                        <label for="location-select">Luogo Attuale</label>
                        <select id="location-select">
                            <option value="Generico">Generico</option>
                            <option value="Casa">Casa</option>
                            <option value="Ristorante">Fuori / Ristorante</option>
                            <option value="Medico">Visita Medica</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label for="listening-mode-select">Ascolto</label>
                        <select id="listening-mode-select">
                            <option value="manual">Manuale</option>
                            <option value="continuous">Passivo</option>
                        </select>
                    </div>
                    <div class="form-group half">
                        <label for="model-select">Modello IA</label>
                        <select id="model-select">
                            <option value="gemini-3.1-flash-lite">3.1 Flash-Lite (Veloce)</option>
                            <option value="gemini-3.5-flash">3.5 Flash (Bilanciato)</option>
                            <option value="gemini-2.5-flash">2.5 Flash (Legacy)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="voice-select">Voce Sintesi Vocale (TTS)</label>
                    <select id="voice-select">
                        <!-- Populated by JS -->
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label for="voice-rate">Velocità</label>
                        <input type="range" id="voice-rate" min="0.5" max="2" step="0.1" value="1">
                        <span id="rate-val">1.0x</span>
                    </div>
                    <div class="form-group half">
                        <label for="voice-pitch">Tonalità</label>
                        <input type="range" id="voice-pitch" min="0.5" max="1.5" step="0.1" value="1">
                        <span id="pitch-val">1.0</span>
                    </div>
                </div>

                <!-- Configurable Emergency Shortcuts -->
                <div class="form-group emergency-config-section">
                    <label>Pulsanti di Emergenza Personalizzati</label>
                    <div class="emergency-config-row">
                        <input type="text" id="em-lbl-1" placeholder="Etichetta (es. 🚨 AIUTO)" class="em-input-lbl">
                        <input type="text" id="em-txt-1" placeholder="Frase parlata (es. Aiuto!)" class="em-input-txt">
                    </div>
                    <div class="emergency-config-row">
                        <input type="text" id="em-lbl-2" placeholder="Etichetta (es. 🥤 SETE)" class="em-input-lbl">
                        <input type="text" id="em-txt-2" placeholder="Frase parlata (es. Voglio bere)" class="em-input-txt">
                    </div>
                    <div class="emergency-config-row">
                        <input type="text" id="em-lbl-3" placeholder="Etichetta (es. 🚾 BAGNO)" class="em-input-lbl">
                        <input type="text" id="em-txt-3" placeholder="Frase parlata (es. Devo andare in bagno)" class="em-input-txt">
                    </div>
                    <div class="emergency-config-row">
                        <input type="text" id="em-lbl-4" placeholder="Etichetta (es. ⚠️ DOLORE)" class="em-input-lbl">
                        <input type="text" id="em-txt-4" placeholder="Frase parlata (es. Sento dolore)" class="em-input-txt">
                    </div>
                </div>

                <div class="form-group danger-zone">
                    <h3>Dati & Memoria</h3>
                    <button id="clear-memory-btn" class="secondary-btn danger">Cancella cronologia risposte</button>
                </div>
            </div>
            <div class="modal-footer">
                <button id="settings-save-btn" class="primary-btn">Salva Impostazioni</button>
            </div>
        </div>
    </div>

    <!-- CUSTOM TEXT INPUT MODAL -->
    <div id="custom-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="custom-title">
        <div class="modal-content custom-text-content">
            <div class="modal-header">
                <h2 id="custom-title">Messaggio Personalizzato</h2>
                <button id="custom-close-btn" class="close-btn" aria-label="Chiudi">&times;</button>
            </div>
            <div class="modal-body">
                <textarea id="custom-text-input" placeholder="Scrivi qui quello che vuoi dire..." rows="4"></textarea>
                
                <!-- Quick Phrases inside keyboard modal (dynamic prediction grid) -->
                <div class="quick-words-grid" id="predictive-words-grid">
                    <!-- Word pills will be injected here dynamically by JS -->
                </div>
            </div>
            <div class="modal-footer">
                <button id="custom-clear-btn" class="secondary-btn">Cancella</button>
                <button id="custom-speak-btn" class="primary-btn speak">🗣️ Parla</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
